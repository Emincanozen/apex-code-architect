<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="apex-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="45%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <radialGradient id="apex-glow-cyan" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="apex-glow-blue" cx="82%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="apex-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.55"/>
    </pattern>

    <!-- Card Filter -->
    <filter id="apex-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#apex-bg)"/>
  <rect width="1200" height="340" fill="url(#apex-grid)"/>
  <rect width="1200" height="340" fill="url(#apex-glow-cyan)"/>
  <rect width="1200" height="340" fill="url(#apex-glow-blue)"/>
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.65"/>

  <!-- Left Content Area -->
  <g transform="translate(64, 48)">
    <!-- Category Pill -->
    <rect width="336" height="28" rx="14" fill="#0369a1" fill-opacity="0.22" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="14" r="4.5" fill="#38bdf8"/>
    <text x="30" y="18.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#7dd3fc" letter-spacing="1">AGENT SKILLS SPEC • DETERMINISTIC PROTOCOL</text>

    <!-- Main Title -->
    <text x="0" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="42" font-weight="900" fill="#f8fafc" letter-spacing="-0.8">APEX CODE ARCHITECT</text>

    <!-- Subtitle -->
    <text x="0" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="16.5" font-weight="400" fill="#94a3b8">
      Deterministic AST Blast-Radius Mapping, Polyglot Parsing &amp; Cyclomatic Gates
    </text>

    <!-- Value Proposition Sentence -->
    <text x="0" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#64748b">
      Enforces zero blind multi-file edits, freezes interfaces &amp; bounds self-repair loops for AI agents.
    </text>

    <!-- Feature Pills Row -->
    <g transform="translate(0, 178)">
      <!-- Pill 1: AST Topology -->
      <g transform="translate(0, 0)">
        <rect width="144" height="34" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.45"/>
        <circle cx="16" cy="17" r="4" fill="#38bdf8"/>
        <text x="28" y="21.5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">AST Fan-In Maps</text>
      </g>
      <!-- Pill 2: McCabe Gate -->
      <g transform="translate(154, 0)">
        <rect width="146" height="34" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#34d399" stroke-width="1" stroke-opacity="0.45"/>
        <circle cx="16" cy="17" r="4" fill="#34d399"/>
        <text x="28" y="21.5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Gate McCabe &lt;= 12</text>
      </g>
      <!-- Pill 3: 5-Stage Protocol -->
      <g transform="translate(310, 0)">
        <rect width="138" height="34" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#818cf8" stroke-width="1" stroke-opacity="0.45"/>
        <circle cx="16" cy="17" r="4" fill="#818cf8"/>
        <text x="28" y="21.5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">5-Stage Pipeline</text>
      </g>
      <!-- Pill 4: Zero Deps -->
      <g transform="translate(458, 0)">
        <rect width="144" height="34" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#c084fc" stroke-width="1" stroke-opacity="0.45"/>
        <circle cx="16" cy="17" r="4" fill="#c084fc"/>
        <text x="28" y="21.5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">0 External Deps</text>
      </g>
    </g>
  </g>

  <!-- Right Visual / Diagram Area -->
  <g transform="translate(730, 42)">
    <!-- Surrounding Glass Container -->
    <rect width="406" height="256" rx="14" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.2" filter="url(#apex-shadow)"/>

    <!-- Subtle Header inside container -->
    <rect x="0" y="0" width="406" height="36" rx="14" fill="#1e293b" fill-opacity="0.6"/>
    <circle cx="18" cy="18" r="4.5" fill="#ef4444"/>
    <circle cx="34" cy="18" r="4.5" fill="#f59e0b"/>
    <circle cx="50" cy="18" r="4.5" fill="#10b981"/>
    <text x="203" y="22" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="500" fill="#94a3b8">topology-visualizer • blast-score: 10</text>

    <!-- Branching Topology Nodes -->
    <!-- Connecting Lines -->
    <path d="M 120 100 L 210 148" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M 120 196 L 210 148" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M 210 148 L 310 110" stroke="#34d399" stroke-width="2.2" stroke-opacity="0.85"/>
    <path d="M 210 148 L 310 186" stroke="#818cf8" stroke-width="1.8" stroke-opacity="0.7"/>

    <!-- Node 1: Module A -->
    <rect x="36" y="82" width="112" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="92" y="104" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#7dd3fc">core/engine.py</text>

    <!-- Node 2: Module B -->
    <rect x="36" y="178" width="112" height="36" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1.2"/>
    <text x="92" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#93c5fd">adapters/cli.py</text>

    <!-- Central Hub Node (ast_blast_radius) -->
    <rect x="160" y="128" width="102" height="42" rx="10" fill="#0369a1" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="178" cy="149" r="6" fill="#38bdf8"/>
    <text x="214" y="153" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#f0f9ff">HUB FILE</text>

    <!-- Node 3: Test Suite Node (PASS) -->
    <rect x="272" y="92" width="116" height="36" rx="8" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.4"/>
    <text x="330" y="114" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#6ee7b7">test_suite: PASS</text>

    <!-- Node 4: Complexity Gate -->
    <rect x="272" y="168" width="116" height="36" rx="8" fill="#312e81" fill-opacity="0.4" stroke="#818cf8" stroke-width="1.4"/>
    <text x="330" y="190" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#c7d2fe">McCabe: &lt;= 12</text>

    <!-- Bottom Status Banner in Container -->
    <g transform="translate(18, 222)">
      <rect width="370" height="22" rx="6" fill="#047857" fill-opacity="0.2" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.5"/>
      <circle cx="12" cy="11" r="3.5" fill="#34d399"/>
      <text x="22" y="14.5" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#34d399">13 UNIT TESTS VERIFIED (0.041s) • ZERO BLAST VIOLATIONS</text>
    </g>
  </g>
</svg>